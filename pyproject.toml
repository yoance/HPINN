[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpinn"
version = "0.1.0"
description = "Hadamard Physics-Informed Neural Networks for solving PDEs (heat, KdV)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "tensorflow>=2.15",
    "tf-keras",
    "matplotlib",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "pandas",
    "tabulate",
]

[dependency-groups]
playground = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]
